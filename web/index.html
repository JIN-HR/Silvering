<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cyber_project">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cyber_project</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>

    <h1>회원가입</h1>

    <!-- 회원가입 폼 -->
    <form method="POST" action="/signup">
      <label for="signup_username">사용자 이름:</label>
      <input type="text" id="signup_username" name="username" required><br>

      <label for="signup_password">비밀번호:</label>
      <input type="password" id="signup_password" name="password" required><br>

      <input type="submit" value="회원가입">
    </form>

    <p>이미 회원가입을 하셨나요?</p>
    <!-- 로그인하기 버튼 -->
    <a href="/login">
      <button>로그인하기</button>
    </a>

    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
